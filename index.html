<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f3f7">
<title>90 Day Reset</title>
<style>
:root{--bg:#f8f6f8;--card:#fff;--text:#29262b;--muted:#817a84;--line:#ebe6eb;--accent:#9b6f91;--accent-soft:#f0e7ef;--green:#6d9a7b;--shadow:0 8px 30px rgba(55,40,52,.07)}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#faf8fa,#f6f3f6);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer}
.app{max-width:760px;margin:auto;padding:24px 16px 90px}
header{display:flex;justify-content:space-between;margin-bottom:20px}
h1{font-size:30px;line-height:1.1;margin:0 0 5px}.subtitle{color:var(--muted);margin:0}
.icon{border:1px solid var(--line);background:#fff;width:42px;height:42px;border-radius:14px}
.tabs{display:flex;gap:6px;background:#eee9ee;padding:5px;border-radius:15px;margin-bottom:18px}
.tab{flex:1;border:0;background:transparent;color:var(--muted);padding:10px;border-radius:11px;font-weight:600}
.tab.active{background:#fff;color:var(--text)}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.hero-top{display:flex;justify-content:space-between;align-items:center}
.day{font-weight:700;color:var(--accent)}.date,.meta{color:var(--muted);font-size:13px}
.percent{font-size:34px;font-weight:750}
.progress{height:9px;background:#eee9ee;border-radius:99px;overflow:hidden;margin-top:15px}
.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#b990ad);border-radius:99px}
.small{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:9px}
.title{font-size:17px;font-weight:750;margin-bottom:10px}
.habit{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.habit:last-child{border:0}
.check{width:27px;height:27px;border-radius:9px;border:1.5px solid #d7d0d7;background:#fff;flex:none}
.check.done{background:var(--green);border-color:var(--green);color:#fff}
.check.done:after{content:"✓";font-weight:800}
.habit-name{font-weight:600}.done .habit-name{text-decoration:line-through;color:#89828a}.main{flex:1}
.qty{display:flex;gap:6px;align-items:center}.qty input{width:62px;text-align:center;border:1px solid var(--line);border-radius:10px;padding:7px}
.qty button{width:30px;height:30px;border:1px solid var(--line);background:#faf9fa;border-radius:9px}
textarea,input[type=date],input[type=text]{border:1px solid var(--line);border-radius:11px;padding:9px;background:#fff}
textarea{width:100%;min-height:90px;resize:vertical}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#faf8fa;border:1px solid var(--line);border-radius:15px;padding:13px}.stat b{display:block;font-size:21px}.stat span{font-size:12px;color:var(--muted)}
.history{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.daycell{text-align:center}
.dot{aspect-ratio:1;border-radius:10px;background:#eee9ee;display:grid;place-items:center;font-size:11px}
.partial{background:#eaddea;color:#725c6e}.full{background:#b5d0bb;color:#36533d}.weekday{font-size:10px;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.edit{display:flex;gap:8px;margin:8px 0}.edit input{flex:1}.remove,.danger{border:0;background:transparent;color:#a56d6d}
.secondary{border:0;border-radius:12px;padding:10px 14px;background:var(--accent-soft);color:#634d5f;font-weight:650}
.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}
footer{text-align:center;color:#aaa1a9;font-size:12px;margin-top:25px}
@media(max-width:480px){.app{padding:18px 12px 80px}h1{font-size:27px}.percent{font-size:30px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div><h1>90 Day Reset</h1><p class="subtitle">Small actions, every day.</p></div>
  <button class="icon" id="todayBtn">⌂</button>
</header>

<nav class="tabs">
  <button class="tab active" data-view="today">Today</button>
  <button class="tab" data-view="progress">Progress</button>
  <button class="tab" data-view="settings">Settings</button>
</nav>

<main id="todayView">
<section class="card">
  <div class="hero-top">
    <div><div class="day" id="dayLabel"></div><div class="date" id="dateLabel"></div></div>
    <div class="percent" id="percent">0%</div>
  </div>
  <div class="progress"><span id="bar" style="width:0%"></span></div>
  <div class="small"><span id="completed"></span><span id="streak"></span></div>
</section>

<section class="card">
  <div class="title">Today's habits</div>
  <div id="habits"></div>
</section>

<section class="card">
  <div class="title">Notes</div>
  <textarea id="notes" placeholder="How did today go?"></textarea>
</section>
</main>

<main id="progressView" class="hidden">
<section class="card">
  <div class="title">Your progress</div>
  <div class="stats">
    <div class="stat"><b id="avg7">0%</b><span>7-day average</span></div>
    <div class="stat"><b id="avg30">0%</b><span>30-day average</span></div>
    <div class="stat"><b id="avg90">0%</b><span>90-day average</span></div>
  </div>
</section>

<section class="card">
  <div class="title">Last 7 days</div>
  <div class="history" id="history"></div>
</section>

<section class="card">
  <div class="title">90-day overview</div>
  <div class="progress"><span id="overall" style="width:0%"></span></div>
  <div class="small"><span id="overallText"></span><span id="left"></span></div>
</section>
</main>

<main id="settingsView" class="hidden">
<section class="card">
  <div class="title">Reset settings</div>
  <div class="row">
    <div><b>Start date</b><div class="meta">Day 1 begins here.</div></div>
    <input id="startDate" type="date">
  </div>
</section>

<section class="card">
  <div class="title">Habits</div>
  <div id="editor"></div>
  <button class="secondary" id="addHabit">+ Add habit</button>
</section>

<section class="card">
  <div class="title">Data</div>
  <div class="actions">
    <button class="secondary" id="export">Export backup</button>
    <button class="secondary" id="import">Restore backup</button>
    <button class="danger" id="reset">Reset all data</button>
    <input id="file" type="file" accept=".json" class="hidden">
  </div>
</section>
</main>

<footer>Your data stays on this device. No account or backend.</footer>
</div>

<script>
const KEY="reset90_v1";

const defaults=[
  ["wake","Wake by 7:00 AM"],
  ["sleep","Sleep early"],
  ["water","Drink water","L",3],
  ["workout","Workout"],
  ["steps","7–10K steps","steps",7000],
  ["meals","Cooked / home meals"],
  ["protein","Vegetables + protein"],
  ["tablets","Take deficiency tablets"],
  ["learn","Learn 3 things"],
  ["work","Productive work"],
  ["scroll","Reduce Instagram / doom scrolling"],
  ["pray","Pray"],
  ["clean","Clean room"]
];

function today(){
  const d=new Date();
  return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
function dateObj(s){
  const [y,m,d]=s.split("-").map(Number);
  return new Date(y,m-1,d);
}
function fmt(s){
  return dateObj(s).toLocaleDateString(undefined,{
    weekday:"long",month:"long",day:"numeric",year:"numeric"
  });
}
function offset(s,n){
  const d=dateObj(s);
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}
function diff(a,b){
  return Math.floor((dateObj(b)-dateObj(a))/86400000);
}
function fresh(){
  return {
    startDate:today(),
    habits:defaults.map(x=>({
      id:x[0],
      name:x[1],
      ...(x[2]?{type:"quantity",unit:x[2],target:x[3]}:{})
    })),
    days:{}
  };
}

let state;
try{
  state=JSON.parse(localStorage.getItem(KEY))||fresh();
}catch{
  state=fresh();
}
let current=today();

function save(){
  localStorage.setItem(KEY,JSON.stringify(state));
}
function day(s){
  if(!state.days[s]) state.days[s]={done:{},values:{},notes:""};
  return state.days[s];
}
function dayNumber(s){
  return diff(state.startDate,s)+1;
}
function valid(s){
  return dayNumber(s)>=1&&dayNumber(s)<=90;
}
function complete(h,d){
  return h.type==="quantity"
    ? Number(d.values[h.id]||0)>=Number(h.target)
    : !!d.done[h.id];
}
function pct(s){
  if(!valid(s)||!state.habits.length) return 0;
  const d=day(s);
  return Math.round(
    state.habits.filter(h=>complete(h,d)).length/state.habits.length*100
  );
}
function getStreak(){
  let count=0,s=current;
  while(valid(s)&&pct(s)>0){
    count++;
    s=offset(s,-1);
  }
  return count;
}
function changeQty(h,delta){
  const d=day(current);
  const step=h.unit==="L"?.1:500;
  d.values[h.id]=Math.max(0,Number(d.values[h.id]||0)+delta*step);
  save();
  render();
}

function renderToday(){
  const d=day(current);
  const p=pct(current);
  const number=dayNumber(current);

  dayLabel.textContent=valid(current)?"Day "+number+" of 90":"Outside your 90 days";
  dateLabel.textContent=fmt(current);
  percent.textContent=p+"%";
  bar.style.width=p+"%";

  const c=state.habits.filter(h=>complete(h,d)).length;
  completed.textContent=c+" of "+state.habits.length+" complete";
  streak.textContent=getStreak()+" day streak";

  habits.innerHTML="";

  state.habits.forEach(h=>{
    const r=document.createElement("div");
    r.className="habit "+(complete(h,d)?"done":"");

    const b=document.createElement("button");
    b.className="check "+(complete(h,d)?"done":"");

    if(h.type!=="quantity"){
      b.onclick=()=>{
        d.done[h.id]=!d.done[h.id];
        save();
        render();
      };
    }

    const m=document.createElement("div");
    m.className="main";

    const name=document.createElement("div");
    name.className="habit-name";
    name.textContent=h.name;
    m.appendChild(name);

    if(h.type==="quantity"){
      const meta=document.createElement("div");
      meta.className="meta";
      meta.textContent="Target: "+h.target+" "+h.unit;
      m.appendChild(meta);
    }

    r.append(b,m);

    if(h.type==="quantity"){
      const q=document.createElement("div");
      q.className="qty";

      const minus=document.createElement("button");
      minus.textContent="−";
      minus.onclick=()=>changeQty(h,-1);

      const inp=document.createElement("input");
      inp.type="number";
      inp.min=0;
      inp.value=d.values[h.id]??0;
      inp.step=h.unit==="L"?.1:100;
      inp.onchange=()=>{
        d.values[h.id]=Math.max(0,Number(inp.value)||0);
        save();
        render();
      };

      const plus=document.createElement("button");
      plus.textContent="+";
      plus.onclick=()=>changeQty(h,1);

      q.append(minus,inp,plus);
      r.append(q);
    }

    habits.append(r);
  });

  notes.value=d.notes||"";
}

function average(days){
  let sum=0,count=0;
  for(let i=0;i<days;i++){
    const s=offset(current,-i);
    if(valid(s)){
      sum+=pct(s);
      count++;
    }
  }
  return count?Math.round(sum/count):0;
}

function renderProgress(){
  avg7.textContent=average(7)+"%";
  avg30.textContent=average(30)+"%";
  avg90.textContent=average(90)+"%";
  history.innerHTML="";

  for(let i=6;i>=0;i--){
    const s=offset(current,-i);
    const p=pct(s);
    const c=document.createElement("div");
    c.className="daycell";

    const d=document.createElement("div");
    d.className="dot "+(p===100?"full":p?"partial":"");
    d.textContent=p+"%";

    const w=document.createElement("div");
    w.className="weekday";
    w.textContent=dateObj(s).toLocaleDateString(undefined,{weekday:"short"});

    c.append(d,w);
    history.append(c);
  }

  let sum=0,active=0,full=0;
  for(let i=0;i<90;i++){
    const s=offset(state.startDate,i);
    if(dateObj(s)>dateObj(current)) break;
    sum+=pct(s);
    active++;
    if(pct(s)===100) full++;
  }

  const overallPct=active?Math.round(sum/active):0;
  overall.style.width=overallPct+"%";
  overallText.textContent=full+" fully completed day"+(full===1?"":"s");
  left.textContent=Math.max(0,90-active)+" days left";
}

function renderSettings(){
  startDate.value=state.startDate;
  editor.innerHTML="";

  state.habits.forEach((h,i)=>{
    const r=document.createElement("div");
    r.className="edit";

    const x=document.createElement("input");
    x.type="text";
    x.value=h.name;
    x.onchange=()=>{
      h.name=x.value.trim()||"Habit";
      save();
      render();
    };

    const rm=document.createElement("button");
    rm.className="remove";
    rm.textContent="Remove";
    rm.onclick=()=>{
      if(state.habits.length===1){
        alert("Keep at least one habit.");
        return;
      }
      state.habits.splice(i,1);
      save();
      render();
    };

    r.append(x,rm);
    editor.append(r);
  });
}

function render(){
  renderToday();
  renderProgress();
  renderSettings();
}

function show(view){
  ["today","progress","settings"].forEach(x=>{
    document.getElementById(x+"View").classList.toggle("hidden",x!==view);
  });
  document.querySelectorAll(".tab").forEach(x=>{
    x.classList.toggle("active",x.dataset.view===view);
  });
}

document.querySelectorAll(".tab").forEach(x=>{
  x.onclick=()=>show(x.dataset.view);
});

todayBtn.onclick=()=>{
  current=today();
  show("today");
  renderToday();
};

document.getElementById("notes").oninput=()=>{
  day(current).notes=notes.value;
  save();
};

document.getElementById("startDate").onchange=()=>{
  state.startDate=startDate.value||today();
  save();
  render();
};

document.getElementById("addHabit").onclick=()=>{
  state.habits.push({
    id:"custom_"+Date.now(),
    name:"New habit"
  });
  save();
  render();
};

document.getElementById("export").onclick=()=>{
  const a=document.createElement("a");
  a.href=URL.createObjectURL(
    new Blob([JSON.stringify(state,null,2)],{type:"application/json"})
  );
  a.download="90-day-reset-backup.json";
  a.click();
};

document.getElementById("import").onclick=()=>document.getElementById("file").click();

document.getElementById("file").onchange=e=>{
  const f=e.target.files[0];
  if(!f)return;

  const r=new FileReader();
  r.onload=()=>{
    try{
      const x=JSON.parse(r.result);
      if(!x.habits||!x.days) throw 0;
      state=x;
      save();
      render();
      alert("Backup restored.");
    }catch{
      alert("Invalid backup file.");
    }
  };
  r.readAsText(f);
};

document.getElementById("reset").onclick=()=>{
  if(confirm("Reset all habits, notes, and progress?")){
    state=fresh();
    save();
    render();
  }
};

render();
</script>
</body>
</html>
